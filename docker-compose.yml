name: mybid

services:
  ip-allocator:
    build:
      context: ./ip-allocator
    image: mybid-ip-allocator:latest
    container_name: mybid-ip-allocator
    restart: unless-stopped
    environment:
      DB_HOST: 166.0.19.103
      DB_PORT: "13307"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ad
      ALLOCATOR_PORT: "18010"
      BATCH_SIZE: "20"
      LOW_WATER: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mybid-net

  mybid:
    build:
      context: .
      dockerfile: Dockerfile_mybid
    image: mybid-bot:latest
    restart: unless-stopped
    depends_on:
      ip-allocator:
        condition: service_healthy
    environment:
      ALLOCATOR_URL: http://ip-allocator:18010
      BOOTSTRAP_BASE: http://bootstrap.mitm.local:18080
      MITM_PORT: "18008"
      AD_TIMEOUT_SEC: "30"
      AFTER_CLICK_SEC: "5"
      CLICK_RATE: "1"
    extra_hosts:
      - "bootstrap.mitm.local:127.0.0.1"
    networks:
      - mybid-net

networks:
  mybid-net:
    driver: bridge